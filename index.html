<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DE VENOM — Cinematic AI Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#050914;color:#eef4ff}
.wrap{max-width:900px;margin:auto;padding:28px 16px}
.hero{padding:28px 0 20px}
h1{font-size:clamp(38px,10vw,72px);margin:0;color:#fff}
h2{margin:0 0 12px}
p{color:#aab8d4;line-height:1.5}
.badge{display:inline-block;padding:7px 10px;border:1px solid #263c69;border-radius:999px;color:#79a9ff;font-size:12px;margin-bottom:14px}
.card{background:#0b1222;border:1px solid #1b2b4b;border-radius:18px;padding:20px;margin:16px 0;box-shadow:0 12px 35px #0005}
label{display:block;font-weight:bold;margin:14px 0 7px}
input,textarea,select{width:100%;padding:13px;border-radius:10px;border:1px solid #2a3b5d;background:#070d19;color:#fff;font-size:15px}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:14px;margin-top:14px;border:0;border-radius:10px;background:#2563eb;color:#fff;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.55}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.result{margin-top:15px}
video,audio{width:100%;margin-top:12px;border-radius:10px}
.status{padding:12px;border-radius:10px;background:#080f1d;color:#aab8d4;white-space:pre-wrap}
small{color:#7f90b0}
@media(max-width:650px){.row{grid-template-columns:1fr}}
</style>
</head>

<body>
<div class="wrap">

<section class="hero">
<div class="badge">CINEMATIC AI STUDIO</div>
<h1>DE VENOM</h1>
<p>Make your photo move. Create a 6-second cinematic AI video and optionally add AI voice audio.</p>
</section>

<section class="card">
<h2>🎬 AI Image → Video</h2>

<label for="image">Photo</label>
<input id="image" type="file" accept="image/jpeg,image/png,image/webp">

<label for="motion">Movement command</label>
<textarea id="motion" placeholder="Example: Make the person smile naturally, slowly move their head, and let their hair move gently in the wind."></textarea>

<div class="row">

<div>
<label for="resolution">Resolution</label>
<select id="resolution">
<option value="480p">480p</option>
<option value="720p" selected>720p</option>
<option value="1080p">1080p</option>
<option value="4k">4K</option>
</select>
</div>

<div>
<label for="voice">AI Voice</label>
<select id="voice">
<option value="Morgan Freeman" selected>Morgan Freeman</option>
<option value="Scarlett Johansson">Scarlett Johansson</option>
<option value="David Attenborough">David Attenborough</option>
<option value="Emma Stone">Emma Stone</option>
</select>
</div>

</div>

<label for="audioText">AI audio / voice text (optional)</label>
<textarea id="audioText" placeholder="Type what you want the AI voice to say. Leave empty for video without added voice audio."></textarea>

<button id="generate">Generate 6-Second Video</button>

<div class="result" id="videoResult"></div>
</section>


<section class="card">
<h2>🔊 AI Audio Only</h2>

<label for="audioOnlyText">Text</label>
<textarea id="audioOnlyText" placeholder="Type something for the AI voice to say."></textarea>

<button id="generateAudio">Generate AI Audio</button>

<div class="result" id="audioResult"></div>
</section>


<section class="card">
<h2>⭐ Premium</h2>

<p>Enter your Premium access key to activate Premium features.</p>

<input id="premiumKey" type="password" placeholder="Premium access key">

<button id="activatePremium">Activate Premium</button>

<div class="result" id="premiumResult"></div>
</section>


<section class="card">
<h2>👑 Admin Price Control</h2>

<input id="adminKey" type="password" placeholder="Admin key">

<div class="row">
<input id="monthly" type="number" value="1000" min="0" placeholder="Monthly ₦">
<input id="yearly" type="number" value="15000" min="0" placeholder="Yearly ₦">
</div>

<button id="savePrices">Save Prices</button>

<div class="result" id="adminResult"></div>
</section>

<section class="card">
<small>DE VENOM • AI Image-to-Video • 6 seconds</small>
</section>

</div>


<script>

const $ = id => document.getElementById(id);


function show(el,text){

el.innerHTML =
'<div class="status">' +
String(text).replace(/[&<>]/g,m=>({
'&':'&amp;',
'<':'&lt;',
'>':'&gt;'
}[m])) +
'</div>';

}


/* VIDEO */

$("generate").onclick = async () => {

const file = $("image").files[0];
const motion = $("motion").value.trim();
const resolution = $("resolution").value;
const audioText = $("audioText").value.trim();
const voiceName = $("voice").value;


if(!file){

show($("videoResult"),"Please choose an image.");
return;

}


if(!motion){

show($("videoResult"),"Please enter a movement command.");
return;

}


const fd = new FormData();

fd.append("image",file);
fd.append("motion",motion);
fd.append("resolution",resolution);
fd.append("audioText",audioText);
fd.append("voiceName",voiceName);


$("generate").disabled = true;
$("generate").textContent = "Generating…";

show(
$("videoResult"),
"Creating your cinematic video. This can take a few minutes…"
);


try{

const r = await fetch(
"/api/create-video",
{
method:"POST",
body:fd
}
);


const data =
await r.json().catch(
()=>({error:"Invalid server response."})
);


if(!r.ok){

throw new Error(
data.error ||
"Video generation failed."
);

}


$("videoResult").innerHTML =

'<div class="status">Video ready.</div>' +

'<video controls playsinline src="' +
data.video +
'"></video>' +

'<a href="' +
data.video +
'" target="_blank" rel="noopener">' +

'<button>Open Video</button>' +

'</a>';


}catch(e){

show(
$("videoResult"),
e.message
);

}finally{

$("generate").disabled = false;

$("generate").textContent =
"Generate 6-Second Video";

}

};


/* AUDIO ONLY */

$("generateAudio").onclick = async () => {

const text =
$("audioOnlyText").value.trim();

const voiceName =
$("voice").value;


if(!text){

show(
$("audioResult"),
"Please enter text for the AI voice."
);

return;

}


$("generateAudio").disabled = true;

$("generateAudio").textContent =
"Generating…";


show(
$("audioResult"),
"Generating AI audio…"
);


try{

const r = await fetch(
"/api/create-audio",
{
method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
text,
voiceName
})

}
);


const data =
await r.json().catch(
()=>({
error:"Invalid server response."
})
);


if(!r.ok){

throw new Error(
data.error ||
"Audio generation failed."
);

}


$("audioResult").innerHTML =

'<div class="status">Audio ready.</div>' +

'<audio controls src="' +
data.audio +
'"></audio>';


}catch(e){

show(
$("audioResult"),
e.message
);

}finally{

$("generateAudio").disabled = false;

$("generateAudio").textContent =
"Generate AI Audio";

}

};


/* PREMIUM */

$("activatePremium").onclick = async () => {

const key =
$("premiumKey").value.trim();


if(!key){

show(
$("premiumResult"),
"Enter your Premium access key."
);

return;

}


try{

const r = await fetch(
"/api/premium/activate",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({
key
})

}
);


const data =
await r.json().catch(
()=>({
error:"Invalid server response."
})
);


if(!r.ok){

throw new Error(
data.error ||
"Premium activation failed."
);

}


localStorage.setItem(
"deVenomPremiumToken",
data.token || key
);


show(
$("premiumResult"),
"Premium activated successfully."
);


}catch(e){

show(
$("premiumResult"),
e.message
);

}

};


/* ADMIN */

$("savePrices").onclick = async () => {

const key =
$("adminKey").value.trim();


if(!key){

show(
$("adminResult"),
"Enter your Admin key."
);

return;

}


try{

const r = await fetch(
"/api/prices",
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:JSON.stringify({

adminKey:key,

monthly:Number(
$("monthly").value
),

yearly:Number(
$("yearly").value
)

})

}
);


const data =
await r.json().catch(
()=>({
error:"Invalid server response."
})
);


if(!r.ok){

throw new Error(
data.error ||
"Could not save prices."
);

}


show(
$("adminResult"),
"Prices saved."
);


}catch(e){

show(
$("adminResult"),
e.message
);

}

};

</script>

</body>
</html>
